catalog_checked: 2026-10-07       # when kit prices below were last verified
catalog_stale_after_days: 365   # then remind you (monthly) to refresh them
fail_alert_after_runs: 12       # alert once if a source fails this many runs in a row (~6h)
heartbeat_days: 7               # weekly "still alive" ping (silent priority)
forget_after_days: 60

# Deal feeds. Add more any time (any RSS/Atom URL works).
# NOTE: Reddit often blocks cloud IPs; if it fails you'll get a failure alert and can just delete it.
sources:
  - name: Slickdeals - EGO power tools
    url: https://slickdeals.net/newsearch.php?q=ego+power+tools&searcharea=deals&searchin=first&rss=1
  - name: Slickdeals - EGO battery
    url: https://slickdeals.net/newsearch.php?q=ego+battery&searcharea=deals&searchin=first&rss=1
  - name: Slickdeals - EGO kit
    url: https://slickdeals.net/newsearch.php?q=ego+kit&searcharea=deals&searchin=first&rss=1
  - name: Reddit r/ToolDeals - EGO
    url: https://www.reddit.com/r/ToolDeals/search.rss?q=ego&restrict_sr=on&sort=new
  # Optional, UNTESTED: used listings near you (Craigslist RSS; titles carry the price). Uncomment to try;
  # if it gets blocked you'll just get a source-failing alert and can delete it.
  # - name: Craigslist Long Island - EGO
  #   url: https://longisland.craigslist.org/search/sss?query=ego+power&format=rss

# Standalone batteries (no resale offset). Titles that also mention a tool are skipped.
battery_only:
  enabled: true
  exclude_if: 'mower|blower|trimmer|saw|washer|snow|fan|kit|combo|string|hedge|pole|mulcher|tiller'

