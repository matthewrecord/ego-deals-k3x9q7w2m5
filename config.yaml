# =============================================================================
# MAINTENANCE GUIDE  (for the human AND for any LLM asked to update this file)
# =============================================================================
# WHAT THIS IS: config for watcher.py, which runs on GitHub Actions every ~30 min,
# reads deal feeds (Slickdeals, r/ToolDeals), and sends an ntfy push when an EGO
# listing's net cost per Ah is low:   (price - est. resale of non-battery parts) / total Ah
# GOAL: the owner is rebuilding a 56V battery supply, so cheap Ah is the point.
#
# TO REFRESH THE CATALOG (about yearly, or when the weekly digest shows new models):
#  1. Get current US list/dealer prices, battery sizes and bare-tool prices from a
#     retailer catalog (e.g. toolup.com/collections/ego, acehardware.com, egopowerplus.com).
#     Official egopowerplus.com pages list models but NOT prices or kit contents.
#  2. For each kit set: name, match, ah (TOTAL Ah of all batteries in the kit),
#     msrp, and bare (bare-tool price) if known. Add resale only to override the formula.
#  3. Add cat/size/prop/tags so model-less titles can be matched:
#       cat  = mower|zeroturn|tractor|snow|pressure|blower|chainsaw|hedge|polesaw|trimmer|shovel|auger
#       size = inches (mowers, saws, snow, hedge), CFM (blowers), PSI (pressure washers)
#       prop = sp|push for mowers; '1'|'2' (stage) for snow blowers
#       tags = xp (Select Cut XP / XP series), peak (Peak Power)
#  4. match is a list of regexes tested on the LOWERCASED listing title. Use the model
#     number with a lookahead so prefixes don't collide, e.g. lm2135(?![a-z0-9]|-[0-9a-z])
#     (so LM2135 won't match LM2135SP). For models ending in -2 use the form
#     lm2156sp\-2(?![a-z0-9]).
#  5. Set catalog_checked below to today's date.
#
# PITFALLS ALREADY HIT:
#  - Retailers write "4Ah (2P)" or "2P" for the CELL CONFIGURATION, not two batteries.
#    CS1613 and CS1803 each ship with ONE 4.0Ah battery. Confirm the battery COUNT from a
#    second source (a Slickdeals title or the retailer's product title) before trusting it.
#  - A "-2" model suffix usually means a two-battery kit (LM2134SP-2, LM2156SP-2).
#  - Dealer prices drift; use one consistent source. msrp only feeds the resale estimate
#    (and a sanity floor: prices under 35% of msrp are ignored as mis-parses).
#  - Unknown or ambiguous Ah or price: leave the kit out rather than guess.
#
# BEFORE COMMITTING:
#  - Load this file with yaml.safe_load. Confirm every kit's title matches itself and that no
#    kit's regex catches another kit's model number (watcher.match_kit on "EGO <model> $100").
#  - Confirm nothing alerts at list price: watcher.evaluate("EGO <model> kit $<msrp>", cfg)
#    must produce no tier for any kit.
#  - Dry run: DRY_RUN=1 python watcher.py   (prints alerts, sends nothing, writes no state).
#  - Then commit config.yaml to the repo; the next scheduled run picks it up.
#
#  BARE TOOLS (bare_tools section): tools that never come with batteries get a plain
#  percent-off-typical-price check instead of the $/Ah math. To add one: name, match regexes
#  (same lookahead style as kits), and ref = typical new US price. Make sure no bare_tools
#  regex also matches a kit (a kit title would be skipped as a bare tool); the bare check runs first.
#  Only add tools that truly never ship in a kit; bare versions of kit tools (e.g. LM2150SP) are
#  deliberately not here.
#
# TUNING: thresholds and small_battery_thresholds are $/Ah bars (lower = pickier).
#  resale_factor (0.65) and bare_estimate_per_ah (28) drive every resale estimate.
#  Don't edit watcher.py for routine updates; config.yaml is the only file that needs it.
# =============================================================================

# Net harvesting cost per Ah = (kit price - resale) / total Ah
thresholds:
  strong: 25                    # high-priority alert at or below this $/Ah
  watch: 30                     # normal-priority alert at or below this $/Ah
  realert_if_price_drops_pct: 3 # re-alert on a listing only if the price falls by this much

# Stricter bar for small packs: kits or standalone batteries with total capacity under below_ah.
small_battery_thresholds:
  below_ah: 5
  strong: 15
  watch: 20

# Tools that never ship in a battery kit (fans, commercial line, Multi-Head attachments, etc.).
# No battery to harvest, so the only question is how far below its normal price a listing is.
# A listing at or below ref x (1 - deep_discount_pct/100) triggers a DEEP DISCOUNT alert. Refurbished /
# reconditioned listings count too (typically 30-35% off, so they only alert if deeper than the bar).
# Override per tool with pct: N. ref = typical new US dealer price (Oct 2026).
bare_tools:
  deep_discount_pct: 40
  tools:
  - name: FN1000 10in Misting Fan
    match:
    - 'fn1000(?![a-z0-9])'
    alt:  # descriptive titles; only used when the title also says EGO
    - '10.{0,3}(in|inch|\")?\s?(oscillating )?misting fan'
    ref: 199
  - name: FN1800 18in Misting Fan
    match:
    - 'fn180[04](?![a-z0-9])'
    alt:  # descriptive titles; only used when the title also says EGO
    - '18.{0,3}(in|inch|\")?\s?misting fan'
    ref: 309
  - name: WDV0900 Wet/Dry Vacuum
    match:
    - 'wdv0900(?![a-z0-9])'
    alt:  # descriptive titles; only used when the title also says EGO
    - 'wet.?/?\s?dry vac'
    ref: 329
  - name: LT0300 3000lm Prism Light
